<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFS Studio - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <h2>AFS Studio</h2>
            </div>
            <p class="subtitle">Enter your details to access the AI Generator</p>

            <form id="loginForm">
                <div class="input-group">
                    <label><i class="fa-solid fa-user"></i> Full Name</label>
                    <input type="text" id="nameInput" placeholder="Enter your name (e.g., Muhammad Ayan)" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="emailInput" placeholder="ayanf6383@gmail.com" required>
                </div>

                <button type="submit" class="neon-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Launch Studio
                </button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
