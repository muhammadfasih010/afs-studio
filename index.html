
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-card">
        <div class="brand-logo">✨ AI Studio</div>
        
        <!-- Toggle Tabs -->
        <div class="tab-container">
            <button id="loginTabBtn" class="tab-btn active" type="button" onclick="switchTab('login')">Login</button>
            <button id="signupTabBtn" class="tab-btn" type="button" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="auth-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="primary-btn">Login to Account</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="auth-form hidden">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Ali" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="primary-btn">Create Account</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
  </html>
