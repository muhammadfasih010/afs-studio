<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Text to Image</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2 id="form-title">Welcome Back</h2>

            <!-- Sliding Tab Switcher Top -->
            <div class="tab-switch-container">
                <div class="tab-slider" id="tab-slider"></div>
                <button type="button" class="tab-btn active" id="login-tab">Login</button>
                <button type="button" class="tab-btn" id="signup-tab">Sign Up</button>
            </div>

            <form id="auth-form">
                <div class="input-group" id="name-group" style="display: none;">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" id="auth-btn" class="primary-btn">Login</button>
            </form>
            <p class="switch-text">
                <span id="switch-msg">Don't have an account?</span> 
                <a href="#" id="switch-link">Sign Up</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
