<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFS Studio - AI Generator</title>
    <link rel="stylesheet" href="gen.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>AFS Studio</span>
        </div>
        <div class="header-right">
            <span id="welcomeUser">Welcome, User</span>
            <!-- Profile Button to open Member 3 page (set.html) -->
            <button id="profileBtn" title="Profile & Settings"><i class="fa-solid fa-user-gear"></i></button>
        </div>
    </header>

    <main class="main-container">
        <div class="generator-card">
            <h2>AI Text-to-Image Generator</h2>
            <div class="input-group">
                <textarea id="promptInput" placeholder="Describe your masterpiece... (e.g., Cyberpunk neon street, futuristic car, 8k)"></textarea>
            </div>

            <div class="controls-row">
                <div class="control-item">
                    <label><i class="fa-solid fa-expand"></i> Resolution Feature</label>
                    <select id="resolutionSelect">
                        <option value="512x512">512 x 512 (Square - Fast)</option>
                        <option value="768x768" selected>768 x 768 (Balanced)</option>
                        <option value="1024x1024">1024 x 1024 (HD Quality)</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="neon-btn">
                <i class="fa-solid fa-bolt"></i> Generate Image
            </button>
        </div>

        <div class="output-card">
            <div id="resultContainer" class="result-placeholder">
                <i class="fa-solid fa-image"></i>
                <p>Your generated art will appear here</p>
            </div>
            <div class="output-actions" id="outputActions" style="display: none;">
                <a id="downloadBtn" class="neon-btn-secondary" download="afs-studio-art.jpg"><i class="fa-solid fa-download"></i> Download Image</a>
            </div>
        </div>
    </main>

    <script src="gen.js"></script>
</body>
</html>
