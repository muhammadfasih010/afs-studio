<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFS Studio</title>
    <link rel="stylesheet" href="gen.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">AFS IMG Generator</div>
        <div class="nav-right">
            <div class="profile-icon" id="profile-icon">
                <i class="fa-solid fa-user"></i>
            </div>
            <a href="set.html" class="settings-btn" id="settings-btn" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </a>
        </div>
    </header>

    <main class="main-container">
        <section class="generator-section">
            <h1>TEXT TO IMAGE
                By AFS</h1>
            <p>Type a prompt below to generate your AI image.</p>
            
            <div class="prompt-box">
                <textarea id="prompt-input" placeholder="A futuristic cyberpunk city at sunset, highly detailed..."></textarea>
                <button id="generate-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate
                </button>
            </div>
        </section>
<div class="settings-page-wrapper">
    <h2>Account & App Settings</h2>

    <!-- Theme Setting -->
    <div class="setting-group">
        <label>Dark / Light Theme</label>
        <input type="checkbox" id="theme-toggle">
    </div>

    <!-- Resolution Setting -->
    <div class="setting-group">
        <label for="resolution-select">Image Resolution</label>
        <select id="resolution-select">
            <option value="512x512">512 x 512 (Standard)</option>
            <option value="1024x1024">1024 x 1024 (HD)</option>
            <option value="768x512">768 x 512 (Landscape)</option>
        </select>
    </div>

    <!-- History Section -->
    <div class="setting-group">
        <h3>Generation History</h3>
        <button id="clear-history-btn" class="danger-btn">Clear All History</button>
        <div id="history-list" class="history-container">
            <!-- Saved items yahan JavaScript se automatically show honge -->
        </div>
    </div>
            </div>
        
        <section class="display-section">
            <div class="image-card" id="image-card">
                <div class="placeholder-content" id="placeholder-content">
                    <i class="fa-solid fa-image"></i>
                    <p>Your generated image will appear here</p>
                </div>
                <div class="loader" id="loader" style="display: none;"></div>
                <img id="output-image" src="" alt="Generated AI Art" style="display: none;">
            </div>
        </section>
    </main>

    <script src="gen.js"></script>
</body>
</html>
