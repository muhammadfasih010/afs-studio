<div class="settings-layout">
    <!-- Sidebar / Menu Panel -->
    <div class="settings-sidebar">
        <h3 style="margin-bottom: 20px; text-align: center;">Settings Panel</h3>
        <button class="nav-btn active" onclick="switchTab('profile')">Edit Profile</button>
        <button class="nav-btn" onclick="switchTab('appearance')">Theme & Resolution</button>
        <button class="nav-btn" onclick="switchTab('history')">Generation History</button>
        <a href="gen.html" class="nav-btn" style="text-align: center; background: #252525;">← Back to Generator</a>
    </div>

    <!-- Main Content Area -->
    <div class="settings-content">
        
        <!-- Tab 1: Edit Profile -->
        <div id="tab-profile" class="tab-pane active">
            <h2>Edit Profile</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username-input" placeholder="Enter your name" style="width: 100%; padding: 10px; border-radius: 5px; background: #2a2a2a; color: white; border: 1px solid #444;">
            </div>
            <button id="save-profile-btn" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">Save Profile</button>
        </div>

        <!-- Tab 2: Theme & Resolution -->
        <div id="tab-appearance" class="tab-pane" style="display: none;">
            <h2>Appearance & Generator Settings</h2>
            
            <div class="form-group" style="margin-top: 20px;">
                <label><strong>App Theme</strong></label>
                <select id="theme-select" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; background: #2a2a2a; color: white; border: 1px solid #444;">
                    <option value="dark">Dark Theme</option>
                    <option value="light">Light Theme</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label><strong>Default Image Resolution</strong></label>
                <select id="resolution-select" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; background: #2a2a2a; color: white; border: 1px solid #444;">
                    <option value="512x512">512 x 512 (Standard)</option>
                    <option value="1024x1024">1024 x 1024 (HD)</option>
                    <option value="768x512">768 x 512 (Landscape)</option>
                </select>
            </div>
            <p style="color: #4ade80; font-size: 13px; margin-top: 15px;">✓ Settings auto-save instantly.</p>
        </div>

        <!-- Tab 3: Real History -->
        <div id="tab-history" class="tab-pane" style="display: none;">
            <h2>Generated History</h2>
            <p style="color: #aaa; margin-bottom: 15px;">A list of images you have actually created.</p>
            <button id="clear-history-btn" style="padding: 8px 15px; background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px;">Clear All History</button>
            
            <!-- Real history yahan inject hogi -->
            <div id="history-list"></div>
        </div>

    </div>
</div>
