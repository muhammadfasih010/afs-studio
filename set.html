<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFS Studio | Settings</title>
    <link rel="stylesheet" href="set.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-area" id="backToGen" style="cursor: pointer;">
            <i class="fa-solid fa-arrow-left"></i> <span>Back to Generator</span>
        </div>
    </header>

    <main class="settings-container">
        <div class="settings-sidebar">
            <button class="tab-btn active" data-tab="profileTab"><i class="fa-solid fa-user-pen"></i> Edit Profile</button>
            <button class="tab-btn" data-tab="historyTab"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
        </div>

        <div class="settings-content">
            <!-- Profile Tab -->
            <div id="profileTab" class="tab-content active">
                <h2>Profile Settings</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <button type="submit" class="neon-btn"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
                </form>
            </div>

            <!-- History Tab -->
            <div id="historyTab" class="tab-content">
                <h2>Generation History</h2>
                <div id="historyGrid" class="history-grid"></div>
            </div>
        </div>
    </main>
    <script src="set.js"></script>
</body>
</html>
