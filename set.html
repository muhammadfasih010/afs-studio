<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Panel</title>
    <link rel="stylesheet" href="set.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="settings-layout">
    <!-- Sidebar -->
    <div class="settings-sidebar">
        <h3>Settings Panel</h3>
        <button class="nav-btn active" onclick="switchTab('profile', event)"><i class="fa-solid fa-user"></i> Edit Profile</button>
        <button class="nav-btn" onclick="switchTab('appearance', event)"><i class="fa-solid fa-palette"></i> Theme & Resolution</button>
        <button class="nav-btn" onclick="switchTab('history', event)"><i class="fa-solid fa-history"></i> Generation History</button>
        <button id="logout-btn" class="nav-btn" style="color: #ff4d4d; margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        <a href="gen.html" class="nav-btn" style="text-align: center; background: #252525;"><i class="fa-solid fa-arrow-left"></i> Back to Generator</a>
    </div>

    <!-- Content Area -->
    <div class="settings-content">
        <!-- Tab: Profile -->
        <div id="tab-profile" class="tab-pane">
            <h2>Edit Profile</h2>
            <input type="text" id="username-input" placeholder="Enter your name" style="width: 100%; padding: 12px; margin: 15px 0;">
            <button id="save-profile-btn" class="main-btn">Save Profile</button>
        </div>

        <!-- Tab: Theme & Resolution -->
        <div id="tab-appearance" class="tab-pane" style="display: none;">
            <h2>Theme & Resolution</h2>
            <select id="theme-select" style="width: 100%; padding: 12px; margin: 10px 0;">
                <option value="dark">Dark Theme</option>
                <option value="light">Light Theme</option>
            </select>
            <select id="resolution-select" style="width: 100%; padding: 12px; margin: 10px 0;">
                <option value="512x512">512 x 512 (Standard)</option>
                <option value="1024x1024">1024 x 1024 (HD)</option>
                <option value="768x512">768 x 512 (Landscape)</option>
            </select>
        </div>

        <!-- Tab: History -->
        <div id="tab-history" class="tab-pane" style="display: none;">
            <h2>Generated History</h2>
            <button id="clear-history-btn" style="padding: 8px 15px; background: #ff4d4d; color: white; border: none; cursor: pointer; margin-bottom: 15px;">Clear All History</button>
            <div id="history-list"></div>
        </div>
    </div>
</div>

<script src="set.js"></script>
</body>
</html>
